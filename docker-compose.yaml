name: sakuin

x-sakuin-image: &sakuin-image ${SAKUIN_IMAGE:-ghcr.io/brandenxia/sakuin:latest}

services:
  sakuin-init:
    image: *sakuin-image
    pull_policy: always
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if ! sakuin-api-key --state-dir /var/lib/sakuin/operational/api list >/tmp/keys 2>/dev/null; then
          sakuin-api-key --state-dir /var/lib/sakuin/operational/api init
          sakuin-api-key --state-dir /var/lib/sakuin/operational/api list >/tmp/keys
        fi
        if ! grep -q '^reader[[:space:]]' /tmp/keys; then
          printf 'One-time reader API token:\n'
          sakuin-api-key --state-dir /var/lib/sakuin/operational/api create --id reader --permissions search
        fi
        if ! grep -q '^operator[[:space:]]' /tmp/keys; then
          printf 'One-time operator API token:\n'
          sakuin-api-key --state-dir /var/lib/sakuin/operational/api create --id operator --permissions admin
        fi
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - sakuin-data:/var/lib/sakuin
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    restart: "no"

  sakuin:
    image: *sakuin-image
    pull_policy: always
    depends_on:
      sakuin-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SAKUIN_STORAGE_LOCAL_ROOT: /var/lib/sakuin
      SAKUIN_API_CREDENTIAL_STORE_DIRECTORY: /var/lib/sakuin/operational/api
      SAKUIN_API_LISTEN_ADDRESS: 0.0.0.0
      SAKUIN_API_LISTEN_PORT: "8080"
      SAKUIN_NETWORK_LISTEN_PORT: "6881"
      SAKUIN_NETWORK_ENABLE_IPV6: ${SAKUIN_ENABLE_IPV6:-false}
      SAKUIN_DHT_BOOTSTRAP: ${SAKUIN_DHT_BOOTSTRAP:-}
    ports:
      - "127.0.0.1:${SAKUIN_API_PORT:-8080}:8080/tcp"
      - "${SAKUIN_DHT_PORT:-6881}:6881/udp"
    volumes:
      - sakuin-data:/var/lib/sakuin
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/v1/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

volumes:
  sakuin-data:
    name: ${SAKUIN_DATA_VOLUME:-sakuin-data}
