[network]
enable_ipv4 = true
enable_ipv6 = true
listen_port = 6881

[network.dht]
private_network = false
maximum_in_flight = 128
query_timeout_ms = 15000
bootstrap_maximum_in_flight = 8
bootstrap_maximum_attempts = 3
bootstrap_retry_delay_ms = 5000
# A fresh public node needs at least one operator-trusted host:port contact to
# join the DHT proactively. Leaving this empty supports private or passive
# deployments, but produces a startup warning in public mode.
# bootstrap = ["dht-bootstrap.example.net:6881"]
bootstrap = []
bootstrap_file = "dht-bootstrap.txt"

[network.dht.identity]
mode = "bep42"
observation_quorum = 3
vote_window_ms = 600000

[network.dht.routing]
maximum_queued = 1024
maximum_in_flight = 8
maximum_attempts = 2
retry_delay_ms = 5000

[network.dht.metadata]
enabled = true
maximum_in_flight = 64
maximum_queued = 4096
maximum_attempts_per_peer = 3
initial_retry_delay_ms = 30000
maximum_retry_delay_ms = 1800000
connect_timeout_ms = 10000
idle_timeout_ms = 30000
maximum_metadata_bytes = 4194304
maximum_outstanding_requests = 4
maximum_queued_write_bytes = 1048576
storage_conflict_attempts = 3
storage_retry_delay_ms = 1000

[network.dht.metadata.discovery]
# Actively locate peers for observed infohashes instead of waiting for an
# announce_peer query to reveal one. The defaults bound DHT traffic while
# substantially improving metadata coverage on a normally connected node.
enabled = true
maximum_pending = 8192
maximum_in_flight = 64
parallelism_per_hash = 3
maximum_queries_per_hash = 24
retry_delay_ms = 300000

[network.dht.metadata.discovery.backfill]
# Incrementally revisit canonical records that still lack metadata. The scan
# uses a dataset change cursor and pauses when discovery is saturated.
enabled = true
maximum_records_per_poll = 256
refresh_interval_ms = 60000
# Retry unchanged placeholders periodically as peers appear and disappear.
full_rescan_interval_ms = 1800000
retry_delay_ms = 1000

[network.traffic]
window_ms = 3600000
# Remote workers reserve quota in bounded chunks to avoid a coordinator round
# trip for every DHT datagram. Reserved but unused bytes remain charged.
grant_bytes = 65536
# inbound_bytes = 1073741824
# outbound_bytes = 1073741824

[storage]
backend = "local"
local_root = "./data"
block_target_bytes = 2097152
segment_target_bytes = 134217728

# To keep immutable segment blobs in AWS S3 or a path-style S3-compatible
# service, change backend to "s3" and configure this table. local_root remains
# required for manifests, locks, derived indexes, checkpoints, and bounded
# upload/download staging. Credentials are intentionally not stored here; use
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and optionally AWS_SESSION_TOKEN.
# [storage.s3]
# endpoint = "https://s3.amazonaws.com"
# bucket = "sakuin-data"
# region = "us-east-1"
# prefix = "catalog"
# connect_timeout_ms = 10000
# request_timeout_ms = 300000
# maximum_attempts = 3
# retry_delay_ms = 200
# verify_tls = true

[storage.compression]
codec = "zstd"
level = 3

[storage.compaction]
minimum_segments = 4
maximum_warm_segments = 8
warm_block_target_bytes = 65536

# Canonical torrent metadata is retained indefinitely. Observation deletion is
# intentionally opt-in because it permanently reduces historical resolution.
[storage.retention]
enabled = false
observation_cold_age_ms = 2592000000
observation_max_age_ms = 31536000000
cold_block_target_bytes = 8388608
cold_compression_codec = "zstd"
cold_compression_level = 9

[storage.maintenance]
enabled = true
interval_ms = 900000
verification_interval_ms = 86400000

[storage.materialization]
enabled = true
interval_ms = 60000

[indexing.duplicates]
enabled = true
interval_ms = 300000

[indexing.classification]
enabled = true
# A bounded local model learns only content kind from high-confidence
# deterministic results, then fills remaining metadata-complete unknown or
# ambiguous cases. It never learns sensitive labels or overrides a classified
# deterministic result.
learned_fallback_enabled = true
# Detection only assigns a label; it does not hide results. Visibility remains
# an explicit include/exclude/only policy and defaults to including everything.
adult_detection_enabled = true
adult_content_policy = "include"
# Minimum evidence used by exclude/only and the Torznab XXX category.
adult_minimum_confidence = "high"
maximum_files_to_inspect = 100000
maximum_path_bytes = 4096
maximum_tokens = 16384

# Optional exact-token rules add bounded content-kind evidence to the built-in
# classifier. Omit this section for the out-of-box defaults. "match" is "all"
# by default; weight defaults to 100 and must be between 1 and 200.
# [[indexing.classification.rules]]
# id = "my-release-group"
# kind = "series"
# match = "all"
# tokens = ["mygroup", "episode"]
# weight = 120

[api]
enabled = true
credential_store_directory = "./data/operational/api"
# Loopback is the secure default. Put a TLS reverse proxy in front, or
# configure both TLS files below before exposing this listener directly.
listen_address = "127.0.0.1"
listen_port = 8080
maximum_connections = 256
read_buffer_bytes = 16384
request_timeout_ms = 15000
maximum_target_bytes = 8192
maximum_header_bytes = 32768
maximum_header_count = 100
maximum_body_bytes = 1048576
# tls_certificate_chain_file = "/etc/sakuin/tls/fullchain.pem"
# tls_private_key_file = "/etc/sakuin/tls/privkey.pem"

[api.rate_limit]
enabled = true
requests_per_window = 120
window_ms = 60000

[distributed]
maximum_work_items = 65536
# Per-frame work/result payload limit. Larger logical results are divided into
# bounded ordered chunks without increasing the TCP frame or write-queue size.
maximum_payload_bytes = 1048576
# Maximum reassembled logical worker result. Keep this above the encoded size
# of the largest accepted torrent metadata record.
maximum_result_bytes = 8388608
worker_timeout_ms = 30000
lease_duration_ms = 120000
heartbeat_interval_ms = 10000

# Without all three mTLS paths, the coordinator deliberately remains
# loopback-only. With them, it can bind remotely and requires a client
# certificate signed by the dedicated worker CA. A worker certificate's common
# name is its protocol worker id. Port 0 requests an ephemeral test port.
[distributed.coordinator]
enabled = false
# Recoverable work is checkpointed beneath storage.local_root by default.
# Live workers and leases are deliberately not restored; interrupted leases
# become pending work after restart. Set recovery_file only to override the
# default operational/scheduler/work.checkpoint location.
recovery_enabled = true
recovery_maximum_bytes = 536870912
# recovery_file = "/var/lib/sakuin/operational/work.checkpoint"
# Completed and failed work remains an operational idempotency window, then is
# retired by age or oldest-first when this count is exceeded. Durable canonical
# result receipts are managed separately and are not removed here. Omitting or
# setting this to zero selects one quarter of maximum_work_items.
maximum_terminal_work_items = 16384
terminal_work_retention_ms = 604800000
listen_address = "127.0.0.1"
listen_port = 7100
maximum_connections = 256
read_buffer_bytes = 16384
maximum_frame_bytes = 2097152
maximum_queued_write_bytes = 4194304
# Global coordinator bounds for incomplete chunked results. Abandoned
# transfers expire without publishing partial canonical data.
maximum_result_reassembly_bytes = 134217728
maximum_result_transfers = 64
result_transfer_timeout_ms = 120000
idle_timeout_ms = 30000
# tls_trust_anchor_file = "/etc/sakuin/workers/ca.pem"
# tls_certificate_chain_file = "/etc/sakuin/workers/coordinator.pem"
# tls_private_key_file = "/etc/sakuin/workers/coordinator-key.pem"

# Run this configuration as a disposable observation/metadata worker with:
#   sakuin worker --config /etc/sakuin/worker.toml
# The certificate common name must equal `id`. One process registers the
# namespaced protocol workers `id:v4` and/or `id:v6`. Results are acknowledged
# only after the coordinator publishes canonical data plus a durable receipt.
[distributed.worker]
enabled = false
id = "worker-1"
coordinator_address = "127.0.0.1"
coordinator_port = 7100
observation_batch_size = 4096
read_buffer_bytes = 16384
maximum_queued_write_bytes = 4194304
connect_timeout_ms = 10000
request_timeout_ms = 10000
idle_timeout_ms = 30000
# tls_trust_anchor_file = "/etc/sakuin/coordinator/ca.pem"
# tls_certificate_chain_file = "/etc/sakuin/worker/worker-1.pem"
# tls_private_key_file = "/etc/sakuin/worker/worker-1-key.pem"
# tls_server_name = "coordinator.internal"
