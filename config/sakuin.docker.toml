[network]
enable_ipv4 = true
enable_ipv6 = true
listen_port = 6881

[network.dht]
private_network = false
# Explicit entries supplied by SAKUIN_DHT_BOOTSTRAP take precedence.
bootstrap = []
bootstrap_file = "/opt/sakuin/share/sakuin/dht-bootstrap.txt"

[network.dht.identity]
mode = "bep42"

[network.dht.metadata]
enabled = true

[storage]
backend = "local"
local_root = "/var/lib/sakuin"

[storage.retention]
enabled = false

[storage.maintenance]
enabled = true

[storage.materialization]
enabled = true

[indexing.duplicates]
enabled = true

[indexing.classification]
enabled = true
adult_detection_enabled = true
adult_content_policy = "include"
adult_minimum_confidence = "high"

[api]
enabled = true
credential_store_directory = "/var/lib/sakuin/operational/api"
listen_address = "0.0.0.0"
listen_port = 8080

[api.rate_limit]
enabled = true

[distributed.coordinator]
enabled = false

[distributed.worker]
enabled = false
