name: Release binaries and container image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require tags to point into the release branch
        if: github.ref_type == 'tag'
        run: |
          git fetch origin release:refs/remotes/origin/release
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/release

      - name: Install compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang-20 clang-tools-20 cmake \
            libc++-20-dev libc++abi-20-dev lld-20 ninja-build perl \
            pkg-config shellcheck unzip zip

      - name: Validate deployment files
        run: |
          shellcheck scripts/deploy.sh scripts/package-linux.sh scripts/benchmark-deployment.sh
          ./scripts/benchmark-deployment.sh --help >/dev/null
          python3 scripts/check-docker-config.py
          awk -v window_seconds=10 -f scripts/metrics-delta.awk \
            tests/fixtures/metrics/before.prom \
            tests/fixtures/metrics/after.prom | \
            diff --unified tests/fixtures/metrics/expected.tsv -
          docker compose config --quiet

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9

      - name: Build release binaries
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="ci"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          xmake f --yes --mode=release --toolchain=clang-20 \
            --cc=/usr/lib/llvm-20/bin/clang \
            --cxx=/usr/lib/llvm-20/bin/clang++ \
            --ld=/usr/lib/llvm-20/bin/clang++ \
            --sh=/usr/lib/llvm-20/bin/clang++ \
            --sdk=/usr/lib/llvm-20 --runtimes=c++_shared \
            --sakuin_version="${release_version}"
          # Xmake 3.0.9 can schedule an importer before its named-module PCM is
          # materialized when compiling this graph in parallel.
          xmake build --yes --jobs=1 sakuin
          xmake build --yes --jobs=1 sakuin-api-key

      - name: Smoke-test the command line
        run: |
          xmake run sakuin --help
          test "$(xmake run sakuin --version)" = \
            "sakuin ${RELEASE_VERSION}"
          xmake run sakuin-api-key --help
          test "$(xmake run sakuin-api-key --version)" = \
            "sakuin-api-key ${RELEASE_VERSION}"

      - name: Package release bundle
        run: ./scripts/package-linux.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakuin-linux-${{ matrix.architecture }}
          path: |
            dist/sakuin-linux-${{ matrix.architecture }}.tar.gz
            dist/sakuin-linux-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          pattern: sakuin-linux-*
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/sakuin-linux-amd64.tar.gz
            dist/sakuin-linux-amd64.tar.gz.sha256
            dist/sakuin-linux-arm64.tar.gz
            dist/sakuin-linux-arm64.tar.gz.sha256
            docker-compose.yaml

  container:
    name: Publish container image
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brandenxia/sakuin
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SAKUIN_VERSION=${{ github.ref_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify anonymous image access
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/brandenxia/sakuin:${GITHUB_REF_NAME}"
